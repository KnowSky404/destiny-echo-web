name: Feature request / 功能建议
description: Propose a specific, actionable improvement. / 提出明确、可执行的改进需求。
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Chinese and English are both welcome.
        For an open-ended idea or balance discussion, start in [Ideas](https://github.com/KnowSky404/destiny-echo-web/discussions/categories/ideas).
        请先搜索已有 Issue，欢迎使用中文或英文。尚待讨论的构思或数值话题，请先到 [Ideas](https://github.com/KnowSky404/destiny-echo-web/discussions/categories/ideas) 交流。
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: Describe a concrete limitation or player need. / 描述具体的限制或玩家需求。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change / 建议的改动
      description: What should change, and how should it behave? / 希望改动什么，改动后应如何表现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context / 替代方案与补充信息
      description: Optional; include alternatives, examples, or who would benefit. / 选填；可提供替代方案、示例或受益人群。
