name: Bug report / 问题反馈
description: Report a reproducible game or website problem. / 反馈可复现的游戏或网站问题。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Chinese and English are both welcome.
        请先搜索已有 Issue，欢迎使用中文或英文反馈。
        Remove personal information and credentials from logs and screenshots.
        请移除日志和截图中的个人信息与凭据。
  - type: dropdown
    id: environment
    attributes:
      label: Environment / 运行环境
      options:
        - PRO — online game / 正式版
        - PRE — preview / 预览版
        - Local development / 本地开发
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: URL or commit / 页面地址或提交
      description: Optional; helps identify the version you played. / 选填，帮助确认你游玩的版本。
      placeholder: https://destiny-echo-web.littlecontrol.workers.dev/
  - type: input
    id: browser_device
    attributes:
      label: Browser and device / 浏览器与设备
      description: Include the browser version, operating system, and device. / 请提供浏览器版本、操作系统与设备。
      placeholder: Chrome 150, Windows 11, desktop / Safari, iOS, iPhone
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Describe the actions needed to trigger the problem. / 说明触发问题需要进行的操作。
      placeholder: |
        1. Open the game / 打开游戏
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期表现
      description: What did you expect to happen? / 你预期会发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际表现
      description: What happened instead, and how often? / 实际发生了什么，出现频率如何？
    validations:
      required: true
  - type: textarea
    id: run_details
    attributes:
      label: Stage and build / 关卡与构筑
      description: Optional; for combat issues, include the stage, augments, or PRE profile if available. / 选填；战斗问题可补充关卡、残响构筑或可用的 PRE 方案。
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs / 截图或日志
      description: Optional; attach screenshots, a recording, or relevant browser console errors. / 选填；可附截图、录屏或相关浏览器控制台错误。
